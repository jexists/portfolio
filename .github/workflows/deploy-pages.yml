name: Deploy Pages

# 프론트(MSW 목업 모드)를 GitHub Pages(https://jexists.github.io/portfolio/)에 배포한다.
# Go API·MongoDB 는 Pages 에 올릴 수 없으므로 mockup/*.json 이 응답한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /portfolio/
          VITE_USE_MOCK: 'true'
          SITE_URL: https://jexists.github.io/portfolio
      # SPA 딥링크(/portfolio/project/...) 새로고침 대응: 404 응답으로 index.html 을 내려준다
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
