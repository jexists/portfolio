<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <title>정주애 포트폴리오</title>
    <meta name="description" content="디자인·개발·운영을 모두 해 본 5년 차 웹 풀스택 개발자" />
    <!-- 카카오톡·SNS 공유 미리보기. og:image는 절대 URL이어야 한다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="정주애 포트폴리오" />
    <meta property="og:title" content="정주애 포트폴리오" />
    <meta property="og:description" content="디자인·개발·운영을 모두 해 본 5년 차 웹 풀스택 개발자" />
    <meta property="og:url" content="https://jexists.github.io/portfolio/" />
    <meta property="og:image" content="https://jexists.github.io/portfolio/images/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- robots.txt는 도메인 루트에서만 읽혀서 github.io/portfolio/ 하위 경로에선 이 태그가 대신한다 -->
    <meta name="robots" content="noai, noimageai" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
